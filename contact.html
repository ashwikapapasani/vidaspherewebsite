<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | VidaSphere</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Poppins:wght@300;400;500;600&display=swap');

:root{
  --purple: #531a4a;
  --maroon: #611d43;
  --red: #9b2929;
  --lavender: #ae9def;
  --pale-lavender: #d1c8f4;
  --coral: #d34f4f;
  --mint: #b0e8d0;
  --blush: #fcf0f0;
  --input-bg: #f9eef0;
  --cream: #fbf1e9;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Poppins', sans-serif;
  font-weight:300;
  color:var(--purple);
  background:#fff;
}

h1,h2,h3,.logo{
  font-family:'Fraunces', serif;
  font-weight:600;
  margin:0;
}

a{ color:inherit; }

img{ max-width:100%; display:block; }

/* ---------- Header / Nav ---------- */
.site-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:28px 60px;
  flex-wrap:wrap;
  gap:16px;
}
.logo{
  font-size:26px;
  color:var(--lavender);
  text-decoration:none;
  letter-spacing:.5px;
}
.logo.dark{ color:var(--purple); }
nav.mainnav{
  display:flex;
  align-items:center;
  gap:34px;
}
nav.mainnav a{
  text-decoration:none;
  font-size:14px;
  letter-spacing:.3px;
  color:inherit;
  padding-bottom:2px;
}
nav.mainnav a.active{
  text-decoration:underline;
  text-underline-offset:5px;
}
nav.mainnav .ig{
  display:flex;
  align-items:center;
}
nav.mainnav .ig svg{ width:18px; height:18px; }

.on-purple .logo{ color:var(--lavender); }
.on-purple nav.mainnav{ color:var(--lavender); }
.on-red .logo{ color:var(--lavender); }
.on-red nav.mainnav{ color:#fff; }
.on-blush .logo, .on-lav .logo{ color:var(--purple); }
.on-blush nav.mainnav, .on-lav nav.mainnav{ color:var(--purple); }

/* ---------- Buttons ---------- */
.btn{
  display:inline-block;
  border:none;
  cursor:pointer;
  border-radius:999px;
  padding:16px 40px;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  letter-spacing:.3px;
  text-decoration:none;
  text-align:center;
}
.btn-lavender{ background:var(--lavender); color:var(--purple); }
.btn-purple{ background:var(--purple); color:var(--lavender); }

/* ---------- Sections generic ---------- */
section{ padding:70px 60px; }
.bg-purple{ background:var(--purple); color:var(--cream); }
.bg-red{ background:var(--red); color:var(--cream); }
.bg-lavender{ background:var(--lavender); color:var(--purple); }
.bg-pale-lavender{ background:var(--pale-lavender); color:var(--purple); }
.bg-blush{ background:var(--blush); color:var(--purple); }

.center{ text-align:center; }
.narrow{ max-width:760px; margin:0 auto; }

/* ---------- Hero ---------- */
.hero{ padding-top:10px; text-align:center; }
.hero h1{
  font-size:64px;
  color:var(--coral);
  margin-bottom:6px;
}
.hero h2{
  font-size:34px;
  font-weight:500;
  color:var(--coral);
  margin-bottom:26px;
}
.hero p.sub{
  font-size:14px;
  color:var(--cream);
  margin-bottom:40px;
}
.hero img{
  max-width:900px;
  margin:0 auto;
  border-radius:2px;
}
.hero p.tagline{
  max-width:820px;
  margin:26px auto 0;
  color:var(--coral);
  font-size:14px;
}

/* ---------- Get Involved strip ---------- */
.strip{ text-align:center; padding:36px 60px; }

/* ---------- Two column layout ---------- */
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:56px;
  align-items:center;
  max-width:1280px;
  margin:0 auto;
}
.two-col.reverse .col-text{ order:1; }
.two-col.reverse .col-img{ order:2; }

.col-text h2{ font-size:34px; margin-bottom:22px; }
.col-text h3{ font-size:20px; color:var(--mint); margin:26px 0 10px; }
.col-text p{ font-size:14px; line-height:1.7; margin:0 0 6px; }

/* Donate section specifics */
.donate-heading{ font-size:38px; color:var(--cream); margin-bottom:22px; }
.donate-copy{ font-size:14px; line-height:1.7; margin-bottom:18px; }
.donate-copy a{ color:var(--lavender); text-decoration:underline; }

.donate-box{
  border:1px solid rgba(255,255,255,.5);
  padding:24px;
  margin-top:20px;
}
.donate-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.15);
}
.donate-option:last-of-type{ border-bottom:none; }
.donate-option input{ accent-color:var(--lavender); width:16px; height:16px; }

.dropdown{
  background:var(--maroon);
  border:1px solid rgba(255,255,255,.4);
  border-radius:22px;
  padding:12px 18px;
  margin-top:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}
.covercheck{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  margin-top:18px;
}
.fee-row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-top:16px;
}
.fee-row.total{ font-weight:600; margin-top:4px; }
.donate-box .btn{ margin-top:20px; width:100%; }

/* Mission section text centered */
.mission-text{ text-align:center; }
.mission-text h2{ font-size:34px; margin-bottom:20px; }
.mission-text p{ font-size:14px; line-height:1.8; margin-bottom:16px; }

/* Community section */
.community h2{
  font-size:32px;
  color:var(--lavender);
  text-align:center;
  margin-bottom:40px;
}
.community img{
  max-width:820px;
  margin:0 auto 34px;
}
.community .btn{ display:block; width:max-content; margin:10px auto 0; }

/* ---------- Footer ---------- */
footer.site-footer{
  background:var(--pale-lavender);
  padding:44px 60px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:20px;
}
footer.site-footer .foot-name{ font-size:26px; color:var(--purple); }
footer.site-footer .foot-email{ font-size:26px; color:var(--purple); font-family:'Fraunces',serif; font-weight:600; }
footer.site-footer .ig-foot{ margin-top:14px; }
footer.site-footer .ig-foot svg{ width:18px; height:18px; }

/* ---------- Partners page ---------- */
.partners-hero{ text-align:center; padding-top:60px; }
.partners-hero h1{ font-size:44px; margin-bottom:16px; }
.partners-hero p{ font-size:14px; margin-bottom:50px; }
.partner-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  max-width:640px;
  margin:0 auto 60px;
}
.partner-card{
  height:160px;
  background:#fff;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  box-shadow:0 1px 4px rgba(83,26,74,0.08);
}
.partner-card img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

/* ---------- Gallery page ---------- */
.gallery-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px 40px;
  max-width:1200px;
  margin:0 auto;
}
.gallery-item img{ width:100%; }
.gallery-item p{ font-size:13px; margin-top:10px; }

/* ---------- Contact page ---------- */
.contact-hero h1{ font-size:44px; line-height:1.15; margin-bottom:18px; }
.contact-hero p{ font-size:14px; margin-bottom:40px; }
.contact-form{ max-width:900px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.field label{ font-size:13px; display:block; margin-bottom:6px; }
.field label span{ font-weight:300; opacity:.7; font-size:12px; }
.field input, .field textarea{
  width:100%;
  background:var(--input-bg);
  border:1px solid var(--purple);
  border-radius:22px;
  padding:14px 18px;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  color:var(--purple);
}
.field textarea{ border-radius:18px; min-height:90px; resize:vertical; }
.contact-form .btn{ margin-top:6px; }

/* ---------- Responsive ---------- */
@media (max-width: 860px){
  .site-header{ padding:22px 24px; }
  section{ padding:50px 24px; }
  .two-col, .partner-grid, .gallery-grid, .form-row{ grid-template-columns:1fr; }
  .hero h1{ font-size:44px; }
  .hero h2{ font-size:24px; }
  footer.site-footer{ padding:36px 24px; }
  .two-col .col-img{ order:-1 !important; }
  .two-col .col-text{ order:2 !important; }
}

@media (max-width: 600px){
  .site-header{ flex-direction:column; justify-content:center; text-align:center; }
  nav.mainnav{ flex-wrap:wrap; justify-content:center; gap:14px 22px; }
  section{ padding:40px 20px; }
  .hero h1{ font-size:34px; }
  .hero h2{ font-size:20px; }
  .contact-hero h1, .partners-hero h1{ font-size:30px; }
  .donate-heading{ font-size:28px; }
  .mission-text h2, .col-text h2{ font-size:26px; }
  .community h2{ font-size:24px; margin-bottom:24px; }
  .community .btn{ width:100%; }
  footer.site-footer{ flex-direction:column; align-items:center; text-align:center; }
  footer.site-footer .ig-foot{ display:flex; justify-content:center; }
}

</style>
</head>
<body>

<header class="site-header on-lav bg-pale-lavender">
  <a href="index.html" class="logo dark">VidaSphere</a>
  <nav class="mainnav">
    <a href="partners.html">Partners</a>
    <a href="carefinder.html">Care Finder</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" class="active">Contact</a>
    <a class="ig" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    </a>
  </nav>
</header>

<section class="bg-pale-lavender contact-hero">
  <h1>Be Part of<br>Something Real</h1>
  <p>Please reach out to us with any questions or thoughts and we would be happy to help!</p>

  <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <p style="display:none">
      <label>Don't fill this out if you're human: <input name="bot-field"></label>
    </p>
    <label style="font-size:13px;display:block;margin-bottom:8px;">Name</label>
    <div class="form-row">
      <div class="field">
        <label>First Name <span>(required)</span></label>
        <input type="text" name="first_name" required>
      </div>
      <div class="field">
        <label>Last Name <span>(required)</span></label>
        <input type="text" name="last_name" required>
      </div>
    </div>
    <div class="field" style="margin-bottom:20px;">
      <label>Email <span>(required)</span></label>
      <input type="email" name="email" required>
    </div>
    <div class="field" style="margin-bottom:26px;">
      <label>Message <span>(required)</span></label>
      <textarea name="message" required></textarea>
    </div>
    <button type="submit" class="btn btn-purple">SEND</button>
  </form>
</section>

<footer class="site-footer">
  <div>
    <div class="foot-name">Vidasphere</div>
  </div>
  <div>
    <div class="foot-email"><a href="mailto:teamvsphere@gmail.com">teamvsphere@gmail.com</a></div>
    <div class="ig-foot">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
    </div>
  </div>
</footer>

</body>
</html>
